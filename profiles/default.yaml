# Grid Down station profile — default template (spec §4)
# Copy to ~/.config/grid-down/profiles/<id>.yaml and fill in. Never commit filled profiles.

profile:
  id: default
  callsign: ""        # your callsign, e.g. W1AW
  grid: ""            # Maidenhead grid square, e.g. FN31pr

rig:
  model: ""           # numeric hamlib id from `rigctl -l` (e.g. 3073 = TS-480);
                      # empty = Dummy backend (bench-safe, Doctor warns)
  path: /dev/ttyUSB0
  baud: 38400

audio:
  backend: pipewire
  # Suite-owned endpoints (M2, spec §6.6/G4): `gd audio up` creates
  #   grid_down_{hf,packet,voice}_{in,out}  — in = apps play to, out = apps capture.
  rig_capture: ""     # physical rig capture source name; loopback wiring = Phase 3 adapters
  presets:            # per-app <placeholder> launch args; override defaults in control/core/audio.py
    ardop:
      capture: grid_down_hf_out
      playback: grid_down_hf_in

internet:
  present: false      # air-gap master switch; Doctor enforces off-net behavior when false

winlink:
  secure_password: "" # stored encrypted at rest (Phase 3); never committed
  service_codes: [PUBLIC]

mesh:                 # LoRa / Meshtastic (spec §6.11)
  device:
    type: serial      # serial | tcp | ble
    path: /dev/ttyUSB1
    host: null
  node:
    long_name: ""
    short_name: ""
    region: ""        # e.g. US, EU_433 ...
    modem_preset: ""  # e.g. LONG_FAST
    channel_url: ""   # base64 channel config (PSK stays local)
  daemon:
    enabled: false    # true for Linux-native LoRa HAT via meshtasticd
