# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: pat
name: Pat (Winlink client)
category: winlink
ui:
  tagline: "Winlink webmail client; talks to VARA over the Wine hub"
install:
  strategy: tarball
  recipe: pat
  packages: []
  note: "Pinned upstream tarball/binary shipped in kit, extracted to /opt/grid-down."
launch:
  via: desktop-app
  cmd: "pat"
config:
  adapter: pat-conf
  native_path: "~/.config/pat/config.json"  # XDG_CONFIG_HOME honored (M7)
state: active  # M7: config adapter implemented (key pins at E2E)
