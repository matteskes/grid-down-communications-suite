# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: yaac
name: YAAC
category: aprs
ui:
  tagline: "Yet Another APRS Client (Java)"
install:
  strategy: tarball
  recipe: yaac
  packages: []
  note: "Pinned upstream tarball/binary shipped in kit, extracted to /opt/grid-down."
launch:
  via: desktop-app
  cmd: "java -jar /opt/grid-down/yaac/YAAC.jar"
config:
  adapter: yaac-prefs
  native_path: "~/.yaac/yaac.properties"  # java.util.Properties (M7)
state: active  # M7: config adapter implemented (key pins at E2E)
