# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: osm-navit
name: OSM offline navigation (Navit)
category: map_weather
ui:
  tagline: "Offline OSM navigation (no F45 package; pinned source build)"
install:
  strategy: build
  recipe: osm-navit
  packages: []
  note: "Pinned git tarball built in fedora:45 container during kit build; binary shipped in kit."
launch:
  via: desktop-app
  cmd: "/opt/grid-down/navit/navit"
config:
  adapter: navit-xml
  native_path: "~/.navit/navit.xml"  # seeded from the system default, then patched
state: active  # M7: config adapter implemented (key pins at E2E)
