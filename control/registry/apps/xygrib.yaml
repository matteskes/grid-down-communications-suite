# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: xygrib
name: XYGrib
category: map_weather
ui:
  tagline: "GRIB weather viewer (no F45 package; pinned source build, staged GRIBs)"
install:
  strategy: build
  recipe: xygrib
  packages: []
  note: "Pinned git tarball built in fedora:45 container during kit build; binary shipped in kit."
launch:
  via: desktop-app
  cmd: "/opt/grid-down/xygrib/xyGrib"
config:
  adapter: xygrib-conf
  native_path: "~/.config/openGribs/XyGrib.conf"  # QSettings(org=openGribs, app=XyGrib)
state: active  # M7: config adapter implemented (key pins at E2E)
