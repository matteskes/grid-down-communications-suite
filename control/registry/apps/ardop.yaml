# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: ardop
name: ARDOP TNC
category: winlink
ui:
  tagline: "ARDOP modem for Winlink HF sessions (pflarue/ardop)"
install:
  strategy: build
  recipe: ardop
  packages: []
  note: "Pinned git tarball built in fedora:45 container during kit build; binary shipped in kit."
launch:
  via: managed-service
  # /opt path per kit convention (flwrap, qttermtcp, paracon, …); the build
  # artifact is ardopcf (pflarue/ardop). When <state>/app-args/ardop.args
  # exists (config adapter ardop-cfg, M7) its args replace everything after
  # the binary; otherwise the <capture>/<playback> placeholders resolve via
  # audio presets (§6.6). TCP port pinned at M10 live E2E with the args file.
  cmd: "/opt/grid-down/ardop/ardopcf 8515 <capture> <playback>"
config:
  adapter: ardop-cfg
  native_path: "<state>/app-args/ardop.args"  # launch args — ardopcf has no config file (M7/M8)
state: active  # M7: config adapter implemented (key pins at E2E)
