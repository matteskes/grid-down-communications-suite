# Grid Down app registry entry (schema: docs/SPECIFICATION.md §6.1)
id: meshtasticd
name: Meshtastic daemon
category: mesh
ui:
  tagline: "Linux-native LoRa HAT daemon (upstream RPM, pinned)"
install:
  strategy: tarball
  recipe: meshtasticd
  packages: []
  note: "Pinned upstream tarball/binary shipped in kit, extracted to /opt/grid-down."
launch:
  via: managed-service
  cmd: "meshtasticd"
config:
  adapter: meshtasticd-yaml
  native_path: "/etc/meshtasticd/config.d/99-grid-down.yaml"  # suite-owned drop-in; config.yaml never touched
state: active  # M7: config adapter implemented (key pins at E2E)
