# Install recipe for varac (Phase 0 skeleton)
# strategy: wine — Installed into the shared VARA Wine prefix; installer user-supplied (kit-import/), never redistributed.
recipe:
  id: varac
  strategy: wine
  wine:
    prefix: /opt/grid-down/wine-prefix
    installer_glob: "VarAC*"   # user-supplied .zip/.exe staged in install/kit-import/ (G6)
    exes: [VarAC.exe]   # candidate basenames probed under <prefix>/drive_c
    installer: portable   # plain zip (no Inno setup): unpacked into install_dir, never run
    install_dir: 'C:\VarAC'   # target dir under the prefix's drive_c
    ini_set: []           # config keys the varac-ini adapter may write (§6.2); pinned at live E2E
    license: user-supplied   # applied in-app by the operator; unregistered works (trial delay)
  postinst: []           # systemd units, udev rules, adapter hooks — Phase 1+
