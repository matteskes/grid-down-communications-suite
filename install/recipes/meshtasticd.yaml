# Install recipe for meshtasticd (Phase 0 skeleton)
# strategy: tarball — Pinned upstream tarball/binary shipped in kit, extracted to /opt/grid-down.
recipe:
  id: meshtasticd
  strategy: tarball
  tarball:
    url: PIN-ME          # exact upstream artifact URL
    sha256: PIN-ME
    dest: /opt/grid-down/meshtasticd
  postinst: []           # systemd units, udev rules, adapter hooks — Phase 1+
