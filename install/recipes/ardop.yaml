# Install recipe for ardop (pinned M6a, 2026-10-29)
# strategy: build — pinned git tarball built in fedora:45 container during kit build; binary shipped in kit.
# upstream: pflarue/ardop = "ardopcf" (MIT; Rick Muething, John Wiseman, Peter LaRue).
# The Makefile links ALSA (-lasound, src/linux/ALSASound.o) — hence alsa-lib-devel.
recipe:
  id: ardop
  strategy: build
  license: MIT
  dnf:
    repo: fedora
    packages: [alsa-lib]       # runtime: ardopcf links libasound
  source:
    git: https://github.com/pflarue/ardop.git
    tag: 1.0.4.1.3
    version: 1.0.4.1.3
    sha256: ede4f3cbd54b60c3380444d8f36dfc28ed3ce47089a1414b929e3b8f1718259e
    build_container: fedora:45
    build_deps: [gcc, make, alsa-lib-devel]
    # F45 gcc (C23 default + promoted warnings) vs ardop 1.0.4.1.3 legacy code:
    # K&R-style decls (SendData) -> gnu17; rawhid.c pointer-fd misuse -> the
    # int-conversion/implicit/incompatible-pointer classes were warnings on
    # the gcc this release was built with — keep them warnings.
    build_cmd: make -j"$(nproc)" CFLAGS="-g -MMD -std=gnu17 -Wno-error=int-conversion -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
    artifacts: [ardopcf:.]
  postinst: []           # systemd units, udev rules, adapter hooks — Phase 1+

