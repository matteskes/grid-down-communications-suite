# Install recipe for hamlib (Phase 0 skeleton)
# strategy: dnf — Install from Fedora 45 / RPM Fusion repos at air-gap time via the kit-local dnf repo.
recipe:
  id: hamlib
  strategy: dnf
  license: LGPL-2.1-or-later
  dnf:
    repo: fedora
    packages:
      - hamlib
      - python3-hamlib
  postinst:             # M11a declarative steps (spec §5) — applied by gd_kit_postinst
    - units             # render + install the grid-down-* user unit set for the operator
    - dialout           # serial-port group membership for the operator
