# Install recipe for xygrib (pinned M6a; source pivoted to the Debian-maintained
# fork at the M6d gate — opengribs/XyGrib v1.2.6.1 (2019) cannot build on F45:
# its FindPROJ4 hunts the long-removed proj_api.h (proj >= 8 dropped it). The
# frfa/XyGrib fork is the Debian-packaged continuation (trixie ships 1.3.x),
# uses the modern proj.h API, GPL-3.0 unchanged.
# F45 notes: openjpeg-devel keeps openjpeg.h in a versioned subdir (passed via
# -D flags; the fork's suffix list stops at 2.3); zlib devel = zlib-ng-compat-devel.
recipe:
  id: xygrib
  strategy: build
  license: GPL-3.0
  dnf:
    repo: fedora
    packages: [qt5-qtbase, libpng, openjpeg, proj, zlib-ng-compat, libnova]
  source:
    git: https://github.com/frfa/XyGrib.git
    tag: v1.3.1
    version: 1.3.1
    sha256: d52c426f0e2f363af83c545582178e55ea4890771d314c757f7a7dc1da229e92
    build_container: fedora:45
    build_deps: [cmake, gcc-c++, qt5-qtbase-devel, libpng-devel,
                 openjpeg-devel, zlib-ng-compat-devel, bzip2-devel, proj-devel,
                 libnova-devel]
    # CMAKE_POLICY_VERSION_MINIMUM: 2019-era cmake_minimum_required vs F45 CMake 4.x.
    # F45's openjpeg-devel keeps openjpeg.h in a versioned subdir; pass it + the lib.
    build_cmd: cmake -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DOPENJPEG_INCLUDE_DIR=/usr/include/openjpeg-2.5 -DOPENJPEG_LIBRARY=/usr/lib64/libopenjp2.so -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/dist" && cmake --build build -j"$(nproc)" && cmake --install build
    artifacts: [dist:.]
  config:
    set: []                # writable keys pinned at live E2E (§6.2 discipline, like wine.ini_set)
  postinst: []           # systemd units, udev rules, adapter hooks — Phase 1+


