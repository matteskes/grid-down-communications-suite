# Install recipe for vara-hf (Phase 0 skeleton)
# strategy: wine — Installed into the shared VARA Wine prefix; installer user-supplied (kit-import/), never redistributed.
recipe:
  id: vara-hf
  strategy: wine
  wine:
    prefix: /opt/grid-down/wine-prefix
    installer_glob: "VARA HF*"   # user-supplied .zip/.exe staged in install/kit-import/ (G6)
    exes: [VARA.exe]   # candidate basenames probed under <prefix>/drive_c
    ini_set: []           # config keys the vara-ini adapter may write (§6.2); pinned at live E2E
    license: user-supplied   # applied in-app by the operator; unregistered works (trial delay)
  postinst:             # M11a declarative steps (spec §5) — applied by gd_kit_postinst
    - dialout           # VARA COM ports need the operator in dialout
    - wine-prefix       # shared prefix from the kit's cached tarball (packed at M11b)
    - wine-install      # silent kit-import installer run, in place (G6; details in wine:)
